# 1-2 实验：与 sim/host-sim.cfg 完全相同，仅换运动学为 corexy
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000

[force_move]
enable_force_move: True

[stepper_x]
step_pin: 1
dir_pin: 2
enable_pin: 3
microsteps: 16
rotation_distance: 40
endstop_pin: 4
position_endstop: 0
position_max: 200
homing_speed: 30

[stepper_y]
step_pin: 5
dir_pin: 6
enable_pin: 7
microsteps: 16
rotation_distance: 40
endstop_pin: 8
position_endstop: 0
position_max: 200
homing_speed: 30

[stepper_z]
step_pin: 9
dir_pin: 10
enable_pin: 11
microsteps: 16
rotation_distance: 8
endstop_pin: 12
position_endstop: 0
position_max: 100
homing_speed: 10
